name: Build AAB Play Store

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versi aplikasi (mis. 1.0.1)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pakai Android SDK bawaan runner
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Siapkan keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.jks

      - name: Build AAB rilis
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: IdeaOS-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      # Opsional: upload otomatis ke jalur Internal Testing setelah secret PLAY_SERVICE_ACCOUNT_JSON diisi
      - name: Upload ke Play Console (internal)
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ici.hris
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
